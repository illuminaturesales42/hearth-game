# Cloudflare Pages config for Hearth's public web build.
# The permanent funnel URL (roadmap Phase 0, step #1) — replaces the fragile
# `cloudflared` quick tunnels that die on PC sleep.
#
# The live site is https://hearth-5q8.pages.dev  (append ?tester for testers).
# This name MUST match that existing Cloudflare Pages project so `pnpm deploy`
# UPDATES the site testers already have — do not change it, or you'll create a
# new URL and orphan the old link.
#
# (Aside: the bare `hearth.pages.dev` is a DIFFERENT, unrelated account's parked
# page — *.pages.dev names are globally first-come, so ours got the -5q8 suffix.
# Never hand testers hearth.pages.dev.)
#
# One-time human setup and the deploy commands live in DEPLOY.md.
name = "hearth-5q8"
compatibility_date = "2026-07-08"
pages_build_output_dir = "dist"

# Cloud-save sync API (roadmap Phase B): served same-origin as the game via
# Pages Functions (functions/v1/save.ts) against this D1 database.
# One-time setup already done:
#   wrangler d1 create hearth-saves
#   wrangler d1 execute hearth-saves --remote --command "CREATE TABLE IF NOT
#     EXISTS saves (device_key TEXT PRIMARY KEY, rev INTEGER NOT NULL,
#     updated_at INTEGER NOT NULL, save TEXT NOT NULL)"
#
# Schema now lives in migrations/ rather than in hand-run commands. 0001 recreates
# the saves table with IF NOT EXISTS, so applying it to the live database simply
# records what is already there; 0002 adds the social tables.
#   pnpm db:local    (dev, against .wrangler state)
#   pnpm db:remote   (production — run BEFORE `pnpm deploy`, see DEPLOY.md)
[[d1_databases]]
binding = "DB"
database_name = "hearth-saves"
database_id = "c36c19cc-07fd-48a2-887a-24625d74c249"
migrations_dir = "migrations"
